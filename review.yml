aid: goose-insurance
name: Goose Insurance
review:
  question: Does Goose Insurance publish a public, self-serve API surface for quote,
    bind, issue, or FNOL?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Canada
findings:
  summary: |
    Goose Insurance Services Inc. (Vancouver, British Columbia) publishes NO public
    API surface of any kind. Every first-party developer hostname and path probed on
    2026-07-25 either failed to resolve or returned 404. The company's 125-URL
    sitemap contains no developer, docs, API, or integration path. The only
    "partner" surfaces the company publishes are (a) a carrier-relationships page
    listing the insurers who underwrite its products and (b) a marketing affiliate /
    referral program that pays a referral fee on a tracked link — neither is a
    technical integration surface. There is no login-walled developer portal either:
    the developer surface simply does not exist publicly.

    A host DOES answer at api.gooseinsurance.com — it is Heroku-fronted (server:
    Heroku, heroku-nel reporting headers) and returns a bare HTML 404 at the root
    and at every probed path. This is the private backend for the Goose mobile app,
    not a documented product API. No spec, no reference, no auth documentation is
    published for it.

    Goose is a licensed distributor, not a carrier — it underwrites nothing. Policies
    are placed with AIG Canada (hospital cash, income protection), iA Financial Group
    (group life, AD&D, critical illness), American-Amicable (term life, final
    expense), Teachers Life reinsured by Gen Re (term life), TuGo (travel medical),
    IMG (international medical / trip cancellation), MSH Group (kids, COVID-19),
    Lloyd's of London (Visitors to Canada) and Sutton National (renters). Any data
    exchange with those carriers happens privately; none of it is published.

    This is the expected and correct outcome for a Canadian direct-to-consumer
    insurtech. Canada has no open-insurance mandate — Consumer-Driven Banking
    explicitly excludes insurance — so there is no forcing function to publish
    quote/bind/issue/FNOL as an API. Goose's product IS the app, and the app is the
    only channel.
  developerPortal:
    exists: false
    url: ''
    classification: none
    note: |
      No developer portal was found in any form — not a self-serve portal, not a
      partner login wall, not a marketing "innovation" page.
